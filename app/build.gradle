import com.android.build.OutputFile
import org.apache.tools.ant.taskdefs.condition.Os

import java.util.regex.Matcher
import java.util.regex.Pattern

apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

def getCurrentFlavor() {
    String task = getGradle().getStartParameter().getTaskRequests().toString()
    Matcher matcher = Pattern.compile("(assemble|generate)\\w*(Release|Debug)").matcher(task)
    if (matcher.find()) return matcher.group(2).toLowerCase() else {
        println "Warning: No match found for $task"
        return "debug"
    }
}

android {
    buildToolsVersion "36.1.0"
    ndkVersion "29.0.14206865" // 显式指定
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.github.shadowsocks.plugin.spp"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion 36
        versionCode 1000900
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 指定支持的架构，减少 APK 体积
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Optional release signing from env (used by GitHub Actions / local sign)
    def envStoreFile = System.getenv("SIGNING_KEYSTORE_PATH")
    def envStorePassword = System.getenv("SIGNING_KEYSTORE_PASSWORD")
    def envKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
    def envKeyPassword = System.getenv("SIGNING_KEY_PASSWORD") ?: envStorePassword
    def hasReleaseSigning = envStoreFile && envStorePassword && envKeyAlias

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(envStoreFile)
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }
    sourceSets.main.jniLibs.srcDirs += new File(projectDir, "src/bin")
    namespace 'com.github.shadowsocks.plugin.spp'
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildFeatures {
        buildConfig true
    }
}

task goBuild(type: Exec) {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        println "Warning: Building on Windows is not supported"
    } else {
        executable "sh"
        args "-c", "src/make.bash " + minSdkVersion
    }
}

task goClean(type: Exec) {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        println "Warning: Building on Windows is not supported"
    } else {
        executable "sh"
        args "-c", "src/clean.bash"
    }
}

project.afterEvaluate {
    // 强制在编译最开始执行 Go 构建
    tasks.named("preBuild").configure {
        dependsOn(goBuild)
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation 'com.github.shadowsocks:plugin:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, x86: 3, x86_64: 4]
if (getCurrentFlavor() == 'release') android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def offset = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (offset != null) output.versionCodeOverride = variant.versionCode + offset
    }
}
